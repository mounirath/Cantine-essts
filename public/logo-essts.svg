      .essts-blue { fill: #0022C8; }
      .essts-arabic {
        font-family: 'Cairo', 'Noto Sans Arabic', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        fill: #0022C8;
        text-anchor: middle;
      }
      .essts-latin {
        font-family: 'Montserrat', 'Arial Black', Impact, 'Segoe UI', sans-serif;
        font-weight: 900;
        fill: #0022C8;
        letter-spacing: 14px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g id="essts-graphic" class="essts-blue">
