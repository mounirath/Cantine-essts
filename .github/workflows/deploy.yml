name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Éviter les déploiements concurrents
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Compilation de l'application
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 🔍 Vérification TypeScript
        run: npm run lint

      - name: 🏗️ Construction de la version de production
        run: npm run build

      - name: 🌐 Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Préparation de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Mise en ligne sur GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Déploiement automatique
        id: deployment
        uses: actions/deploy-pages@v4
